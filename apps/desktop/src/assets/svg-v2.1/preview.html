<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GEOWORK Pixel Grass SVG Preview</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f8fb;color:#16202a}
  main{max-width:1180px;margin:0 auto;padding:32px}
  h1{font-size:24px;margin:0 0 10px}
  p{margin:0 0 24px;color:#53616f}
  .card{background:white;border:1px solid #d9e6ef;border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 14px 38px rgba(15,50,85,.08)}
  .dark{background:#071523}
  img{width:100%;height:auto;display:block;image-rendering:pixelated}
  code{background:#edf5fb;border-radius:6px;padding:2px 6px}
</style>
</head>
<body>
<main>
  <h1>GEOWORK Pixel Grass Logo</h1>
  <p>像素风 GEOWORK 全大写字标 + 像素草坪铺开底座。主文件：<code>geowork-pixel-grass-animated.svg</code></p>
  <section class="card"><img src="geowork-pixel-grass-animated.svg" alt="GEOWORK animated pixel grass logo"></section>
  <section class="card dark"><img src="geowork-pixel-grass-transparent.svg" alt="GEOWORK transparent pixel logo on dark background"></section>
</main>
</body>
</html>
