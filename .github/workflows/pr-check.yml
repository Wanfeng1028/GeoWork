name: PR Check

on:
  pull_request:
    branches: [main, master, dev-frontend/TraeCodeCloud-SeedCode]
  # 直推 master 也跑（团队以直推方式协作，保证每次推送都有远端验证）
  push:
    branches: [master]

jobs:
  # 文档检查：验证 AGENT.md 文档路由表中引用的 doc/*.md 文件真实存在。
  # 失败语义：AGENT.md 引用了不存在的文档，路由表已失效。
  doc-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify AGENT.md doc references exist
        run: |
          missing=0
          # tr -d '\r' 兼容 CRLF 行尾（AGENT.md 在 Windows 上编辑）
          for ref in $(grep -oE 'doc/[0-9A-Za-z._/-]+\.md' AGENT.md | tr -d '\r' | sort -u); do
            if [ ! -f "$ref" ]; then
              echo "MISSING: $ref (referenced in AGENT.md)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::AGENT.md references doc files that do not exist"
            exit 1
          fi
          echo "All AGENT.md doc references resolve."

  # 前端检查：lint + typecheck + 单元测试（vitest）+ 构建，并输出覆盖率报告。
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          cd apps/desktop
          npm install --ignore-scripts
      - name: Dependency audit (production, high+)
        # 安全门禁（P6）：生产依赖高危及以上漏洞即红；dev 依赖漏洞不挡。
        run: cd apps/desktop && npm audit --omit=dev --audit-level=high
      - name: Lint & Typecheck
        run: |
          cd apps/desktop
          npm run lint
          npm run typecheck
      - name: Frontend boundary check
        run: node scripts/check_frontend_boundaries.mjs
      - name: Unit tests with coverage
        run: |
          cd apps/desktop
          npx vitest run --coverage
      - name: Build
        run: |
          cd apps/desktop
          npm run build
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: apps/desktop/coverage
          if-no-files-found: warn

  # Go 核心检查：go vet + 全量测试 + 覆盖率 + 增量覆盖率门禁（P4）。
  core-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 增量覆盖率门禁需要 diff 基线 commit（github.event.before）
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - name: Vet
        run: cd core && go vet ./...
      - name: Test with coverage
        run: |
          SKIP=$(grep -v '^#' scripts/ci/flaky-quarantine.txt | grep -v '^$' | paste -sd'|' -)
          cd core && go test ${SKIP:+-skip "$SKIP"} ./... -coverprofile=coverage.out
      - name: Vulnerability check (govulncheck)
        # 安全门禁（P6）：只对"代码实际调用"的漏洞红；stdlib 漏洞由本 job
        # 的 go-version 补丁版本（1.26.6+）兜底。
        run: cd core && go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Diff coverage gate (50%)
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          python scripts/ci/go_diff_coverage.py \
            --profile core/coverage.out \
            --module geowork/core --repo-dir core \
            --base "${GITHUB_EVENT_BEFORE:-HEAD~1}" --threshold 50
      - name: Test with race detector
        # ubuntu runners ship a C toolchain, so -race works here even
        # though local Windows dev boxes may lack cgo. Guards the
        # RunContext/run-field locking (P1-5) against regressions.
        run: cd core && go test -race ./...
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage
          path: core/coverage.out
          if-no-files-found: warn

  # Go 云端检查：go vet + 全量测试 + 覆盖率 + 增量覆盖率门禁（P4）。
  server-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - name: Vet
        run: cd server && go vet ./...
      - name: Test with coverage
        run: |
          SKIP=$(grep -v '^#' scripts/ci/flaky-quarantine.txt | grep -v '^$' | paste -sd'|' -)
          cd server && go test ${SKIP:+-skip "$SKIP"} ./... -coverprofile=coverage.out
      - name: Vulnerability check (govulncheck)
        run: cd server && go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Diff coverage gate (50%)
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          python scripts/ci/go_diff_coverage.py \
            --profile server/coverage.out \
            --module server --repo-dir server \
            --base "${GITHUB_EVENT_BEFORE:-HEAD~1}" --threshold 50
      - name: Test with race detector
        # ubuntu runners ship a C toolchain, so -race works here even
        # though local Windows dev boxes may lack cgo.
        run: cd server && go test -race ./...
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage.out
          if-no-files-found: warn

  # E2E 冒烟：Playwright 拉起 renderer dev server（纯 Chromium，不含 Electron），
  # 另起 cloud server（自动注册 + 临时 SQLite）跑 API 集成用例。
  # 约定见 doc/20-Engineering-E2E-Testing.md。
  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - name: Install desktop dependencies (renderer dev server)
        run: cd apps/desktop && npm install --ignore-scripts
      - name: Install E2E dependencies
        run: cd tests/e2e && npm install
      - name: Install Playwright Chromium
        run: cd tests/e2e && npx playwright install --with-deps chromium
      - name: Start cloud server (auto-register + temp SQLite)
        shell: bash
        run: |
          cd server
          # 放宽 auth 限流（默认 5 次/分钟）：E2E 从单一 IP 集中登录会触发 429。
          GEOWORK_AUTH_RATE_PER_SEC=1000 GEOWORK_AUTH_BURST=1000 \
            GEOWORK_AUTO_REGISTER_ENABLED=true GEOWORK_DB_PATH=/tmp/geowork-e2e.db \
            go run ./cmd/geowork-api > /tmp/geowork-api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8767/health > /dev/null; then
              echo "cloud server ready"
              break
            fi
            sleep 1
            if [ "$i" -eq 60 ]; then
              echo "::error::cloud server not ready in 60s"
              cat /tmp/geowork-api.log
              exit 1
            fi
          done
      - name: Run UI smoke E2E (@smoke)
        run: cd tests/e2e && npx playwright test --grep "@smoke" --reporter=line
      - name: Run API integration E2E
        run: cd tests/e2e && npx playwright test api-integration.spec.ts auth-flow.spec.ts --reporter=line
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          if-no-files-found: warn

  # Windows E2E：主用户平台是 Windows，渲染层差异只在这里能暴露。
  # 与 e2e-smoke 相同矩阵，跑 @smoke 子集。
  e2e-smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install desktop dependencies (renderer dev server)
        run: cd apps/desktop; npm install --ignore-scripts
      - name: Install E2E dependencies
        run: cd tests/e2e; npm install
      - name: Install Playwright Chromium
        run: cd tests/e2e; npx playwright install chromium
      - name: Run UI smoke E2E (@smoke)
        # pwsh 会把裸 @smoke 当 splatting 吞掉，必须加引号。
        run: cd tests/e2e; npx playwright test --grep "@smoke" --reporter=line
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-windows
          path: tests/e2e/playwright-report
          if-no-files-found: warn

  # Python Worker 检查：pytest（排除需要系统 GIS 栈的 integration 用例）
  # + 真实进程级冒烟契约检查（启动 uvicorn，走真实 HTTP，断言响应 schema）。
  worker-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/geo-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          # 纯 Python / 有 wheel 的轻量子集；rasterio/geopandas/earthengine-api 等
          # 系统级 GIS 依赖由 integration 标记的用例单独覆盖（P2）。
          # pypdf：PyPDF2 已停止维护且有未修复 CVE（PYSEC-2026-1835），
          # 官方后继 pypdf API 兼容（PdfReader 同名）。
          pip install fastapi "uvicorn[standard]" pydantic httpx pytest pytest-cov \
            numpy pandas matplotlib python-docx openpyxl python-pptx pypdf python-multipart
      - name: Dependency audit (pip-audit)
        # 安全门禁（P6）：环境内已知漏洞依赖即红。先升 setuptools——
        # runner 预装版本（79.x）有 PYSEC-2026-3447，修复在 83+。
        run: |
          pip install --upgrade "setuptools>=83"
          pip install pip-audit
          pip-audit --skip-editable
      - name: Unit & API tests
        run: python -m pytest -m "not integration" --cov=app --cov-report=xml --cov-report=term
      - name: Smoke contract check (real process + real HTTP)
        working-directory: .
        run: python scripts/worker_smoke_contract.py
      - name: Core<->Worker endpoint contract check
        working-directory: .
        run: python scripts/core_worker_contract.py
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-coverage
          path: workers/geo-python/coverage.xml
          if-no-files-found: warn
