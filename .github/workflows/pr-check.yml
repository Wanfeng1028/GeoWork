name: PR Check

on:
  pull_request:
    branches: [main, master, dev-frontend/TraeCodeCloud-SeedCode]

jobs:
  # 文档检查
  doc-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs
        run: ls doc/*.md

  # 前端检查
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          cd apps/desktop
          npm install --ignore-scripts
      - name: Lint & Typecheck
        run: |
          cd apps/desktop
          npm run lint
          npm run typecheck

  # 后端核心检查
  core-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Test core
        run: |
          cd core
          go test ./...

  # Worker 检查
  worker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test worker
        run: |
          cd workers
          # 如果有测试脚本则运行，否则列出文件
          ls
